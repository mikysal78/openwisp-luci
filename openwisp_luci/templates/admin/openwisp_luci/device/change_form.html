{% extends luci_parent_template|default:"admin/config/device/change_form.html" %}
{% load i18n %}
{% block object-tools-items %}
{% if not add and luci_allowed and luci_url %}
<li>
  {% if luci_unavailable %}
  <a class="luci-link luci-unavailable" title="{{ luci_unavailable }}" aria-disabled="true" style="opacity:.5;cursor:not-allowed">LuCI</a>
  {% else %}
  <a href="{{ luci_url }}" class="luci-link" target="_blank" rel="noopener" title="{% trans 'Open the LuCI web interface of the router in a new tab' %}">LuCI &#8599;</a>
  {% endif %}
</li>
{% endif %}
{{ block.super }}
{% endblock %}
